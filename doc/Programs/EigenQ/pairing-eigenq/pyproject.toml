[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pairinglib"
version = "0.1.0"
description = "Resolution-refinement + rodeo pipeline for the pairing Hamiltonian"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
notebook = ["nbformat>=5.9", "nbconvert>=7", "jupyter", "ipykernel"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
