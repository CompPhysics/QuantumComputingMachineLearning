# Table of contents of the Jupyter Book.  One entry per chapter notebook;
# chapters whose notebook does not exist yet are commented out -- uncomment
# them when Notebooks/chapterN/chapterN.ipynb has been generated.
format: jb-book
root: intro
options:
  numbered: false                   # the notebook titles already read "Chapter N: ..."
parts:
  - caption: Foundations
    chapters:
      - file: chapter1/chapter1
      - file: chapter2/chapter2
      - file: chapter3/chapter3
      - file: chapter4/chapter4
  - caption: Algorithms
    chapters:
      # - file: chapter5/chapter5     # Hamiltonian simulation and time evolution
      - file: chapter6/chapter6
      - file: chapter7/chapter7
      - file: chapter8/chapter8
  - caption: Machines and applications
    chapters:
      # - file: chapter9/chapter9     # quantum error correction
      # - file: chapter10/chapter10   # lattice gauge theories
      - file: chapter11/chapter11
  - caption: Back matter
    chapters:
      - file: references
